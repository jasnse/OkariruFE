<a
  [routerLink]="routerLink"
  class="group flex items-start gap-3 rounded-xl border border-gray-100 bg-white p-4 shadow-sm transition-colors hover:border-[#b91c1c]/40 hover:bg-red-50/40">

  <div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-lg bg-red-50 text-[#b91c1c] transition-colors group-hover:bg-[#b91c1c] group-hover:text-white">
    <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" [attr.d]="iconPath" />
    </svg>
  </div>

  <div>
    <p class="text-sm font-semibold text-gray-900">{{ title }}</p>
    <p class="text-xs text-gray-500">{{ description }}</p>
  </div>
</a>
