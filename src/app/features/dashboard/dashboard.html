<div class="space-y-6 p-6 bg-gray-50/50 min-h-screen">

  <!-- Header sambutan -->
  <div class="rounded-xl bg-white p-5 shadow-sm border border-gray-100">
    <h2 class="text-lg font-bold text-gray-900">Selamat datang, {{ username }} 👋</h2>
    <p class="text-sm text-gray-500">Ringkasan data Statistik Okariru hari ini.</p>
  </div>

  <!-- Statistik -->
  <div class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-4">
    @for (stat of stats(); track stat.label) {
      <app-dashboard-stat-card
        [label]="stat.label"
        [value]="stat.value"
        [iconPath]="stat.iconPath"
        [accentClass]="stat.accentClass"
        [loading]="loading()">
      </app-dashboard-stat-card>
    }
  </div>

</div>
