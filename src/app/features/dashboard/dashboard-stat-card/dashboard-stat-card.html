<div class="flex items-center justify-between rounded-xl bg-white p-5 shadow-sm border border-gray-100">
  <div class="flex items-center gap-4">
    <div class="flex h-11 w-11 shrink-0 items-center justify-center rounded-lg" [class]="accentClass">
      <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" [attr.d]="iconPath" />
      </svg>
    </div>

    <div>
      <p class="text-xs font-medium text-gray-500">{{ label }}</p>

      @if (loading) {
        <div class="mt-1 h-6 w-16 animate-pulse rounded bg-gray-200"></div>
      } @else {
        <p class="text-2xl font-bold text-gray-900">{{ value }}</p>
      }
    </div>
  </div>
</div>
