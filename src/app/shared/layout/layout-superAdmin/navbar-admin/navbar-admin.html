<header class="flex h-16 w-full items-center justify-between border-b border-gray-200 bg-white px-4 sm:px-6">

  <!--  Hamburger & Title -->
  <div class="flex items-center gap-3">
    <button
      type="button"
      (click)="onToggleSidebar()"
      class="text-gray-500 hover:text-gray-700 focus:outline-none lg:hidden"
      aria-label="Buka menu">
      <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
      </svg>
    </button>
    <h1 class="text-base font-medium text-gray-800">{{ titleNavbar() }}</h1>
  </div>

  <!-- Notifikasi & Profil User -->
  <div class="flex items-center gap-3 sm:gap-6">

    <!-- Icon Notifikasi + Red Dot -->
    <!-- <button type="button" class="relative text-gray-500 hover:text-gray-700 focus:outline-none">
      <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M14.857 17.082a2.37 2.37 0 01-4.285 0M12 4.871V4.125C12 3.379 11.459 2.75 10.75 2.75H13.25C12.541 2.75 12 3.379 12 4.125v.746m0 0a6 6 0 00-6 6v3.582l-.646.646a.75.75 0 00.53 1.28h12.232a.75.75 0 00.53-1.28L18 14.453V10.87a6 6 0 00-6-6z" />
      </svg>
      <span class="absolute -right-0.5 -top-0.5 h-2.5 w-2.5 rounded-full bg-red-500 ring-2 ring-white"></span>
    </button> -->

    <!-- Profile Badge & Text -->
    <div class="flex items-center gap-3">

      <div class="flex h-9 w-9 shrink-0 items-center justify-center rounded-full bg-[#C41230] font-semibold text-white text-xs">
        {{ userName }}
      </div>

      <!-- Label Name & Role -->
      <div class="hidden flex-col text-left sm:flex">
        <span class="text-xs font-semibold text-gray-900 leading-snug">{{ username }}</span>
        <span class="text-[11px] text-gray-400 leading-tight">{{ role }}</span>
      </div>
    </div>

  </div>

</header>
