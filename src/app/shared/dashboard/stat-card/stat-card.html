<div class="flex items-center gap-4 rounded-xl border border-gray-100 bg-white p-5 shadow-sm">
    <div class="flex h-12 w-12 shrink-0 items-center justify-center rounded-lg" [class]="iconWrapperClass()">
        <svg class="h-6 w-6" [class]="iconClass()" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" [attr.d]="icon" />
        </svg>
    </div>

    <div class="min-w-0">
        <p class="truncate text-xs font-medium text-gray-500">{{ label }}</p>
        <p class="text-2xl font-bold text-gray-900">{{ value }}</p>
        @if (hint) {
            <p class="mt-0.5 text-xs text-gray-400">{{ hint }}</p>
        }
    </div>
</div>
