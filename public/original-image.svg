<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" class="relative w-full max-w-md h-auto drop-shadow-2xl">
          <defs>
            <linearGradient id="cardGrad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#ffffff"/>
              <stop offset="100%" stop-color="#ffe1e6"/>
            </linearGradient>
            <linearGradient id="cardStripeGrad" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0%" stop-color="#7A0000"/>
              <stop offset="100%" stop-color="#C41230"/>
            </linearGradient>
            <linearGradient id="phoneGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#3a0a12"/>
              <stop offset="100%" stop-color="#1c0509"/>
            </linearGradient>
            <radialGradient id="coinGrad" cx="35%" cy="30%" r="75%">
              <stop offset="0%" stop-color="#fff3d6"/>
              <stop offset="100%" stop-color="#e8b93f"/>
            </radialGradient>
            <linearGradient id="billGrad" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0%" stop-color="#e7f7ee"/>
              <stop offset="100%" stop-color="#bfe9d2"/>
            </linearGradient>
            <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
              <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.25"/>
            </filter>
          </defs>

          <!-- phone mockup (back) -->
          <g filter="url(#softShadow)" transform="translate(60,60) rotate(-8)">
            <rect x="0" y="0" width="190" height="360" rx="28" fill="url(#phoneGrad)"/>
            <rect x="10" y="14" width="170" height="332" rx="18" fill="#ffffff"/>
            <rect x="26" y="40" width="138" height="18" rx="4" fill="#f1d3d8"/>
            <rect x="26" y="70" width="90" height="12" rx="4" fill="#f1d3d8"/>
            <circle cx="95" cy="150" r="46" fill="#C41230" opacity="0.1"/>
            <path d="M75 150 l14 16 l30 -34" fill="none" stroke="#C41230" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
            <rect x="26" y="216" width="138" height="14" rx="4" fill="#f1d3d8"/>
            <rect x="26" y="242" width="100" height="12" rx="4" fill="#fbe6e9"/>
            <rect x="26" y="292" width="138" height="34" rx="17" fill="#C41230"/>
            <text x="95" y="313" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="Arial, sans-serif">Disetujui</text>
          </g>

          <!-- floating credit card (front) -->
          <g filter="url(#softShadow)" transform="translate(190,150) rotate(-6)">
            <rect x="0" y="0" width="230" height="145" rx="20" fill="url(#cardGrad)"/>
            <rect x="0" y="26" width="230" height="16" fill="url(#cardStripeGrad)"/>
            <rect x="20" y="66" width="34" height="26" rx="5" fill="#e8b93f"/>
            <rect x="20" y="108" width="120" height="10" rx="5" fill="#c41230" opacity="0.5"/>
            <rect x="20" y="124" width="80" height="8" rx="4" fill="#c41230" opacity="0.3"/>
            <circle cx="196" cy="112" r="18" fill="#C41230" opacity="0.85"/>
            <circle cx="212" cy="112" r="18" fill="#7A0000" opacity="0.65"/>
          </g>

          <!-- coin 1 -->
          <g filter="url(#softShadow)" transform="translate(58,260)">
            <circle cx="26" cy="26" r="26" fill="url(#coinGrad)"/>
            <text x="26" y="33" font-size="20" font-weight="800" fill="#8a6a12" text-anchor="middle" font-family="Arial, sans-serif">Rp</text>
          </g>
          <!-- coin 2 -->
          <g filter="url(#softShadow)" transform="translate(120,320)">
            <circle cx="18" cy="18" r="18" fill="url(#coinGrad)"/>
            <text x="18" y="24" font-size="14" font-weight="800" fill="#8a6a12" text-anchor="middle" font-family="Arial, sans-serif">Rp</text>
          </g>

          <!-- floating cash bill -->
          <g filter="url(#softShadow)" transform="translate(300,330) rotate(10)">
            <rect x="0" y="0" width="110" height="60" rx="8" fill="url(#billGrad)"/>
            <circle cx="30" cy="30" r="16" fill="#ffffff" opacity="0.7"/>
            <rect x="58" y="16" width="38" height="6" rx="3" fill="#4c9a71" opacity="0.6"/>
            <rect x="58" y="30" width="30" height="6" rx="3" fill="#4c9a71" opacity="0.4"/>
          </g>

          <!-- decorative sparkles -->
          <circle cx="380" cy="90" r="6" fill="#ffffff" opacity="0.8"/>
          <circle cx="410" cy="130" r="4" fill="#ffffff" opacity="0.6"/>
          <circle cx="40" cy="200" r="4" fill="#ffffff" opacity="0.6"/>
        </svg>